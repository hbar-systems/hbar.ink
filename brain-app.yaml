# hbar.ink — brain-app manifest
#
# Single-user thought-drop instrument, packaged as an installable brain app.
# Drops are stored in the iframe's localStorage in v0; brain-memory.write
# integration ships next.
#
# Schema: https://hbar.systems/schemas/brain/app.schema.json
# Created: 2026-05-08

dialect: brain-app/v1
id: hbar-ink
name: hbar.ink
version: 0.12.0
description: Single-user writing instrument. Write anywhere on the page (tap, drag, edit in place, undo), then drop a fragment into the brain. Absorbs compressed thoughts fast. Physicist symbol layer (Greek, operators, bra-ket). The muse in the margin asks one question on cue (Cmd+J), never writes into your drop.
license: AGPL-3.0

author:
  name: hbar
  url: https://hbar.systems
  contact: hello@hbar.systems

repo: https://github.com/hbar-systems/hbar.ink

tab:
  label: Ink
  route: /ink
  order: 25

entries:
  ui_bundle: brain-app-dist/

permissions:
  - memory.write
  - llm.invoke   # v0.11: the muse in the margin, on cue only

requires_layers:
  - layer: episodic
    mode: append
  - layer: episodic
    mode: read
  - layer: semantic
    mode: read

requires_endpoints:
  - POST /memory/append
  - POST /chat/rag

engines:
  brainfoundry-nous: ">=0.7.0"
